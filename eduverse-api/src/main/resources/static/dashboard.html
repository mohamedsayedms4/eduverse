<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Eduverse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="dashboard-body">
    <header>
        <nav>
            <a href="/" class="logo">EDUVERSE</a>
            <div class="user-nav">
                <span id="userEmail" style="margin-right: 1rem; font-weight: 500;"></span>
                <button id="logoutBtn" class="btn" style="background: #fee2e2; color: #dc2626;">Logout</button>
            </div>
        </nav>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar">
            <a href="#" class="sidebar-item active">Dashboard</a>
            <a href="#" class="sidebar-item">Students</a>
            <a href="#" class="sidebar-item">Teachers</a>
            <a href="#" class="sidebar-item">Settings</a>
        </aside>

        <main class="main-content">
            <div id="welcomeSection" style="margin-bottom: 2rem;">
                <h2 id="welcomeMsg" style="font-size: 2.5rem; letter-spacing: -0.02em;">Welcome, User!</h2>
                <p id="userRole" style="color: var(--secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;"></p>
            </div>

            <!-- Management Section -->
            <section id="managementSection" style="display: none; margin-bottom: 3rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h3>Manage Users</h3>
                    <button id="showAddUser" class="btn btn-primary">+ Add New User</button>
                </div>

                <!-- Add User Form (Hidden by default) -->
                <div id="addUserFormContainer" style="display: none; background: white; padding: 2rem; border-radius: 1rem; margin-bottom: 2rem; box-shadow: var(--shadow);">
                    <h4 style="margin-bottom: 1.5rem;">Create New Account</h4>
                    <form id="addUserForm">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label>First Name</label>
                                <input type="text" name="firstName" required>
                            </div>
                            <div class="form-group">
                                <label>Last Name</label>
                                <input type="text" name="lastName" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" name="password" required>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label>Role</label>
                                <select name="role" id="roleSelect" class="btn" style="width: 100%; border: 1px solid #e2e8f0; text-align: left;">
                                    <!-- Options added by JS -->
                                </select>
                            </div>
                            <div class="form-group" id="tenantGroup" style="display: none;">
                                <label>Tenant ID (Schema)</label>
                                <input type="text" name="tenantId">
                            </div>
                        </div>
                        <div style="display: flex; gap: 1rem;">
                            <button type="submit" class="btn btn-primary">Save User</button>
                            <button type="button" id="cancelAddUser" class="btn">Cancel</button>
                        </div>
                    </form>
                </div>

                <div style="background: white; border-radius: 1rem; box-shadow: var(--shadow); overflow: hidden;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead style="background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
                            <tr>
                                <th style="padding: 1rem;">Name</th>
                                <th style="padding: 1rem;">Role</th>
                                <th style="padding: 1rem;">Email</th>
                                <th style="padding: 1rem;">Status</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <!-- Users loaded by JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Students</h3>
                    <div class="value">128</div>
                </div>
                <div class="stat-card">
                    <h3>Active Courses</h3>
                    <div class="value">12</div>
                </div>
                <div class="stat-card">
                    <h3>Revenue</h3>
                    <div class="value">$12,450</div>
                </div>
            </div>

            <section class="recent-activity" style="background: var(--white); padding: 2rem; border-radius: 1rem; box-shadow: var(--shadow);">
                <h3 style="margin-bottom: 1.5rem;">Recent Activity</h3>
                <p style="color: var(--secondary);">No recent activity to show.</p>
            </section>
        </main>
    </div>

    <script src="/js/main.js"></script>
    <script>
        // Inline check for auth before page load
        if (!localStorage.getItem('accessToken')) {
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
