<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء منصة تعليمية - إدوفيرس</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card" style="max-width: 520px;">
        <div class="logo-area">
            <h1>Eduverse</h1>
            <p>أنشئ منصتك التعليمية مجاناً في دقائق</p>
        </div>

        <div id="status"></div>

        <form id="registerForm">
            <div class="form-group">
                <label class="form-label">اسم المنصة / الأكاديمية</label>
                <input type="text" name="name" class="form-control" placeholder="مثال: أكاديمية النخبة التعليمية" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">اسم المعلم (الأول)</label>
                    <input type="text" name="firstName" class="form-control" placeholder="محمد" required>
                </div>
                <div class="form-group">
                    <label class="form-label">اسم العائلة</label>
                    <input type="text" name="lastName" class="form-control" placeholder="أحمد" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" name="email" class="form-control" placeholder="example@mail.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">كلمة المرور</label>
                <input type="password" name="password" class="form-control" placeholder="كلمة مرور قوية" required>
            </div>
            <div class="form-group">
                <label class="form-label">اسم المنصة (معرف فريد بالإنجليزية)</label>
                <input type="text" name="tenantId" class="form-control" placeholder="my-school" pattern="[a-z0-9\-]+" required>
                <small style="color: var(--gray-500); font-size: 0.8rem;">سيظهر كـ: my-school.eduverse.com</small>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">إنشاء المنصة الآن ←</button>
        </form>

        <div class="auth-footer">
            <p>لديك حساب بالفعل؟ <a href="/login.html">سجّل الدخول</a></p>
        </div>
    </div>

    <script src="/js/main.js?v=5"></script>
</body>
</html>
