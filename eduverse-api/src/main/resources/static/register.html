<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Eduverse</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">EDUVERSE</a>
            <div class="nav-links">
                <a href="/login.html" class="btn">Login</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="form-card">
            <h2>Join Eduverse</h2>
            <p style="margin-bottom: 2rem; color: var(--secondary);">Setup your professional school in seconds.</p>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">School Name</label>
                    <input type="text" id="name" name="name" placeholder="e.g. Bright Future Academy" required>
                </div>
                <div class="form-group">
                    <label for="tenantId">Professional Subdomain</label>
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="text" id="tenantId" name="tenantId" placeholder="e.g. brightfuture" required>
                        <span style="font-weight: 600; color: var(--secondary);">.eduverse.com</span>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create My Platform</button>
            </form>
            <div id="status" style="margin-top: 1rem; text-align: center; display: none;"></div>
        </div>
    </main>

    <script src="/js/main.js"></script>
</body>
</html>
