<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل طالب جديد - إدوفيرس</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card" style="max-width: 520px;">
        <div class="logo-area">
            <h1>Eduverse</h1>
            <p>انضم كطالب إلى منصة معلمك التعليمية</p>
        </div>

        <div id="status"></div>

        <form id="studentRegisterForm">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">الاسم الأول</label>
                    <input type="text" name="firstName" class="form-control" placeholder="أحمد" required>
                </div>
                <div class="form-group">
                    <label class="form-label">اسم العائلة</label>
                    <input type="text" name="lastName" class="form-control" placeholder="محمد" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" name="email" class="form-control" placeholder="student@mail.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">كلمة المرور</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label class="form-label">معرف المنصة (اسأل معلمك)</label>
                <input type="text" name="tenantId" class="form-control" placeholder="مثال: my-school" required>
            </div>
            <button type="submit" class="btn btn-success btn-lg" style="width: 100%;">إنشاء حساب الطالب</button>
        </form>

        <div class="auth-footer">
            <p>لديك حساب بالفعل؟ <a href="/login.html">سجّل الدخول</a></p>
        </div>
    </div>

    <script src="/js/main.js?v=5"></script>
</body>
</html>
