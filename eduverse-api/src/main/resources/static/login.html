<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - إدوفيرس</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="logo-area">
            <h1>Eduverse</h1>
            <p>سجّل دخولك للوصول إلى منصتك التعليمية</p>
        </div>

        <div id="status"></div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">كلمة المرور</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">تسجيل الدخول</button>
        </form>

        <div class="auth-footer">
            <p>ليس لديك حساب؟ <a href="/register.html">أنشئ منصتك الآن</a></p>
            <p style="margin-top: 0.5rem;"><a href="/student-signup.html">تسجيل كطالب</a></p>
        </div>
    </div>

    <script src="/js/main.js?v=5"></script>
</body>
</html>
